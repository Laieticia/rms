[supervisord]
user=root
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info

[program:php-fpm]
command = php-fpm --nodaemonize -R
autostart = true
autorestart = true
priority = 999
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
user = root

[program:nginx]
command = /usr/sbin/nginx -g "daemon off;"
autostart = true
autorestart = true
priority = 998
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
user = root

; Worker de queue optionnel. Passe autostart=true si tu utilises des jobs
; (QUEUE_CONNECTION=database/redis). Sur un plan Free/Starter à une seule
; instance ça tourne dans le même conteneur; sur un plan avec plusieurs
; instances, préfère un Background Worker Render séparé.
[program:laravel-queue]
process_name = %(program_name)s_%(process_num)02d
command = php /app/artisan queue:work --sleep=3 --tries=3 --timeout=90
autostart = false
autorestart = true
numprocs = 1
redirect_stderr = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
user = www-data