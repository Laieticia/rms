[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

clear_env = no

; Logs
; NOTE: "error_log" is a GLOBAL php-fpm.conf directive, not a pool directive.
; Setting it here crashes php-fpm with "unknown entry 'error_log'".
; Pool-level logging only supports access.log + slowlog.
access.log = /var/log/php-fpm.access.log

; Timeouts
request_terminate_timeout = 300s
request_slowlog_timeout = 30s
slowlog = /var/log/php-fpm.slow.log